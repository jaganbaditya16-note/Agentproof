[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.1.0"
description = "Independent verification engine for AI agent work"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.16",
    "rich>=13.9",
    "PyYAML>=6.0"
]

[project.scripts]
agentproof = "agentproof.cli:app"

[tool.setuptools.packages.find]
include = ["agentproof*"]
