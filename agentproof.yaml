version: 1

task:
  id: agentproof-local-verification
  name: AgentProof local verification and secret scanning
  goal: >
    Verify changed project files, run automated tests, and detect
    likely exposed credentials using local deterministic checks.

scope:
  allowed_paths:
    - agentproof/**
    - tests/**
    - agentproof.yaml
    - README.md

  forbidden_paths:
    - .env
    - .env.*
    - .git/**
    - .agentproof/**
    - production/**

verification:
  test_command:
    - '.\.venv\Scripts\python.exe'
    - -m
    - pytest
    - -q
  require_tests_to_pass: true

verdict:
  on_test_failure: FAIL
  on_missing_evidence: UNKNOWN

evidence:
  type: python_function
  module: agentproof.security_scan
  function: scan_text
  cases:
    - input: ""
      expected: []
    - input: "ordinary code without credentials"
      expected: []
